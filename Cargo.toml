[package]
name = "cryptui"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
description = "Terminal UI for monitoring multiple crypto exchange accounts (Binance USDⓈ-M Futures first)"
license = "MIT"
repository = "https://github.com/phl3x0r/cryptui"
homepage = "https://github.com/phl3x0r/cryptui"
readme = "README.md"
keywords = ["tui", "trading", "binance", "futures", "ratatui"]
categories = ["command-line-utilities", "finance"]
authors = ["Niklas Hegnelt <wispster@gmail.com>"]

[lib]
name = "cryptui"
path = "src/lib.rs"

[[bin]]
name = "cryptui"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
ratatui = "0.30.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
todo = "warn"
